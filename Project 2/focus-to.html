<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Focus-List</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* animation: 1s load ease-in-out; */
        overflow-x: hidden;
      }

      @keyframes load {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      body {
        min-height: 100vh;
        color: #172033;
        background:
          linear-gradient(
            135deg,
            rgba(35, 28, 74, 0.78),
            rgba(74, 45, 116, 0.52)

          url(./imgs/bgs/BG\ For\ To\ Do.avif) center / cover fixed;
      }

      h1 {
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      .brand {
        width: 45%;
        height: 15%;
        margin-top: 5%;

      }

      .logo {
        position: relative;
        font-family:
          system-ui,
          -apple-system,

          Roboto,
          Oxygen,

          "Open Sans",

      .lo {

      #date {

      .container {

      .white {
        width: 80%;

      #task {
        margin-top: 2.5%;

      #options {

      #calander {

      #add_task {
        border-radius: 15px;

        box-shadow: none;
        outline: none;

        font-family:

          -apple-system,

          Oxygen,
          Ubuntu,
          Cantarell,

      #add_task:hover {

      .total_task {
        background-color: #ffffff;

      }

      #task_count {

      }

      .nu_task {
        color: #797777;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        /* position: absolute; */

        margin-top: -6%;

      }

      .active_task {
        background-color: #ffffff;
        height: 75px;
        width: 22%;
        margin-top: 2.5%;
        margin-left: 1.5%;
        border-radius: 15px;
        overflow: hidden;
      }

      .nu_active {
        color: #797777;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        /* position: absolute; */
        font-size: 12px;
        margin-top: -6%;
        margin-left: 3%;
        font: bolder;
      }

      #active_count {
        color: #000;
        margin-top: 2%;
        margin-left: 5%;
        padding: 0;
      }

      .complete_task {
        background-color: #ffffff;
        height: 75px;
        width: 22%;
        margin-top: 2.5%;
        margin-left: 1.5%;
        border-radius: 15px;
        overflow: hidden;
      }

      .nu_complete {
        color: #797777;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        /* position: absolute; */
        font-size: 12px;
        margin-top: -6%;
        margin-left: 3%;
        font: bolder;
      }

      #complete_count {
        color: #000;
        margin-top: 2%;
        margin-left: 5%;
        padding: 0;
      }

      .high_task {
        background-color: #ffffff;
        height: 75px;
        width: 22%;
        margin-top: 2.5%;
        margin-left: 1.5%;
        border-radius: 15px;
        overflow: hidden;
      }

      .nu_high {
        color: #797777;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

        margin-top: -6%;
        margin-left: 3%;

      }

      #high_count {
        color: #000;
        margin-top: 2%;
        margin-left: 5%;

      }

      #search {
        height: 40px;
        width: 75%;
        border-radius: 15px;
        padding: 0 0 0 1rem;
        display: flex;
        justify-content: space-between;
        border: none;
        box-shadow: none;
        outline: none;
      }

      .rd3_bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .selection {
        width: 100%;
        margin-left: 15%;

        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .selection > button {
        outline: none;
        box-shadow: none;
        border: none;
        cursor: pointer;
        width: 10%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,

          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;

        border-radius: 15px;

      }

      #all:hover {
        color: #554bea;
      }

      #active:hover {
        color: #554bea;
      }

      #completed:hover {
        color: #554bea;
      }

      #high_priority {
        overflow: hidden;
      }

      #high_priority:hover {
        color: #554bea;
      }

      #paper_box {
        margin-top: 5.5%;
      }

      .no {
        color: #797777;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-size: 18px;
      }

      .subs {
        color: #797777;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      .foot {
        position: absolute;
        bottom: -13.5%;
        margin-left: 1%;
        display: flex;
        flex-direction: row;
        width: 100%;
      }

      #tasking {
        color: #797777;
        font-weight: bold;
        width: 150px;
      }

      .bot_ke {
        width: 100%;
      }

      .clear {
        margin-left: 68%;
        border: none;
        background-color: #e6e4e4;
        box-shadow: none;
        outline: none;
        color: red;
        cursor: pointer;
      }

      .task_list {
        position: relative;
        width: 96%;
        height: 40vh;
        margin-top: -0.5%;
        margin-left: 1.5%;
        /* overflow-y: scroll; */
        overflow-x: hidden;
        /* border: 1px solid red; */
        display: none;
        visibility: hidden;
        flex-direction: column;
      }

      .paper_block {
        /* border: 1px solid red; */
        position: relative;
        margin-top: 4%;
        margin-left: 1.5%;
        width: 96%;
        height: 40vh;
        /* display: none;
        visibility: hidden; */
      }

      #active_task {
        width: 14px;
      }

      .ul_list {
        position: relative;
        width: 96%;
        height: auto;
        margin-top: 4%;
        margin-left: 1.5%;
        /* border: 1px solid red; */
        flex-direction: column;
      }

      .li_container {
        background-color: #ffffff;
        padding: 15px;
        border-radius: 15px;
        margin-bottom: 10px;
        margin-left: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }

      .task_row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 7.5vh;
      }

      .rowing {
        display: flex;
        gap: 15px;
        font-size: 13px;
        margin-left: 30px;
      }

      .li_list {
        margin-top: 1.3%;
        width: 100%;
        word-wrap: normal;
      }

      .correct {
        appearance: none;
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        border: 1px solid #797777;
        cursor: pointer;
      }

      input[type="checkbox"]:checked {
        background-color: #3df70e;
        border-color: #007bff;
      }

      .editbtn {
        outline: none;
        border: none;
        overflow: hidden;
        display: flex;
        position: sticky;
        float: right;
        background: #f3f4f8;
        padding: 9px;
        color: #596174;
        cursor: pointer;
      }

      .dating {
        margin-left: 1%;
      }

      .dltbtn {
        right: 6%;
        outline: none;
        border: none;
        overflow: hidden;
        display: flex;
        position: sticky;
        float: right;
        background: #f3f4f8;
        padding: 9px;
        color: #596174;
        cursor: pointer;
      }

      .seting {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div>
      <header class="animate__zoomInDown">
        <div class="brand">
          <div class="logo">✓</div>
          <h1 class="lo">Focus List</h1>
          <div class="subtitle">Plan Task. Do task. Done task</div>
          <span id="date"></span>
        </div>
      </header>

      <div class="uni_white">
        <div class="container">
          <div class="white">
            <div class="task-area">
              <input
                type="search"
                id="task"
                placeholder="What needs to be done?"
              />

              <select name="priority" id="options">
                <option value="LOW">LOW PRIORITY</option>
                <option value="MEDIUM" selected>MEDIUM PRIORITY</option>
                <option value="HIGH">HIGH PRIORITY</option>
              </select>

              <input type="date" id="calander" />

              <button id="add_task" onclick="task()">+ ADD<br />TASK</button>
            </div>

            <div
              class="small-box"
              style="display: flex; flex-direction: row; width: 100%"
            >
              <div class="total_task">
                <h1 id="task_count">0</h1>
                <br />

                <p class="nu_task">Total Tasks</p>
              </div>

              <div class="active_task">
                <h1 id="active_count">0</h1>
                <br />

                <p class="nu_active">Active</p>
              </div>

              <div class="complete_task">
                <h1 id="complete_count">0</h1>
                <br />

                <p class="nu_complete" onclick="complete()">Completed</p>
              </div>

              <div class="high_task">
                <h1 id="high_count">0</h1>
                <br />

                <p class="nu_high">High Priority</p>
              </div>
            </div>

            <div
              class="rd3_bar"
              style="
                display: flex;
                flex-direction: row;
                width: 100%;
                margin-top: 3%;
                margin-left: 1.8%;
              "
            >
              <input
                type="search"
                id="search"
                placeholder="🔎 Search Tasks..."
                onchange="target(event)"
              />

              <div class="selection">
                <button onclick="show_all()" id="all">ALL</button>
                <button onclick="show_active()" id="active">ACTIVE</button>
                <button
                  style="width: 18%"
                  onclick="show_complete()"
                  id="completed"
                >
                  COMPLETED
                </button>
                <button
                  style="width: 20%"
                  onclick="show_high()"
                  id="high_priority"
                >
                  HIGH PRIORITY
                </button>
              </div>
            </div>

            <div class="task_list"></div>

            <div class="paper_block">
              <div id="paper">
                <center>
                  <h1 class="memo" style="font-size: 3rem; margin-top: 2%">
                    📝
                  </h1>
                </center>
              </div>

              <div id="sub-text">
                <center>
                  <h2 class="no">No Task Found</h2>
                  <p class="subs">Add a task or change your filter</p>
                </center>
              </div>
            </div>

            <div class="nothing" style="display: none">
              <center>
                <h1
                  style="color: black; position: absolute; top: 85%; left: 35%"
                >
                  Nothing Here To Display
                </h1>
              </center>
            </div>

            <div class="last">
              <footer class="foot">
                <div
                  class="last_section"
                  style="width: 100%; display: flex; flex-direction: row"
                >
                  <p id="active_task">0</p>
                  <p>active tasks</p>
                  <button class="clear" id="clear_btn">Clear</button>
                </div>
              </footer>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Calander Work //
      const today = new Date();
      const formattedDate = today.toLocaleDateString();
      const din = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];
      const perfect_din = din[today.getDay()];
      document.getElementById("date").textContent =
        `${perfect_din}, ${formattedDate}`;

      // Elementes le rahe hai //

      let arr = JSON.parse(localStorage.getItem("task")) || [];

      const tasking = document.getElementById("task");
      const priority = document.getElementById("options");
      const calander = document.getElementById("calander");

      const taskList = document.querySelector(".task_list");
      const paperBlock = document.querySelector(".paper_block");

      const searching = document.getElementById("search");

      const allkiButton = document.getElementById("all");
      const activekiButton = document.getElementById("active");
      const completedkiButton = document.getElementById("completed");
      const highPrioritykiButton = document.getElementById("high_priority");

      const clearButton = document.querySelector(".clear");

      // Task ko store krvaya yha pe //

      function jamatask() {
        localStorage.setItem("task", JSON.stringify(arr));
        counting();
        show_all();
      }

      // Function to show krega saare
      function show_all() {
        let dikhao = document.querySelectorAll(".li_container");
        for (let i = 0; i < arr.length; i++) {
          if (dikhao[i]) {
            dikhao[i].style.display = "flex";
          }
        }

        if (arr.length === 0) {
          taskList.style.display = "none";
          paperBlock.style.display = "block";
          taskList.style.visibility = "hidden";
          paperBlock.style.visibility = "visible";
        } else {
          taskList.style.display = "flex";
          paperBlock.style.display = "none";
          taskList.style.visibility = "visible";
          paperBlock.style.visibility = "hidden";
        }
      }

      // Function to show active wale apne khali //
      function show_active() {
        let active_dekh = document.querySelectorAll(".li_container");
        let ginti = 0;
        for (let i = 0; i < arr.length; i++) {
          if (active_dekh[i]) {
            if (arr[i].complete === false) {
              active_dekh[i].style.display = "flex";
              ginti++;
            } else {
              active_dekh[i].style.display = "none";
            }
          }
        }
        krlecount(ginti);
      }

      // Function to show apna kaam khhtm bole toh compeleted //
      function show_complete() {
        let complete_wale = document.querySelectorAll(".li_container");
        let ginti = 0;
        for (let i = 0; i < arr.length; i++) {
          if (complete_wale[i]) {
            if (arr[i].complete === true) {
              complete_wale[i].style.display = "flex";
              ginti++;
            } else {
              complete_wale[i].style.display = "none";
            }
          }
        }
        krlecount(ginti);
      }

      // Function to show only HIGH PRIORITY wale log
      function show_high() {
        let high_dekh = document.querySelectorAll(".li_container");
        let ginti = 0;
        for (let i = 0; i < arr.length; i++) {
          if (high_dekh[i]) {
            if (arr[i].prior === "HIGH") {
              high_dekh[i].style.display = "flex";
              ginti++;
            } else {
              high_dekh[i].style.display = "none";
            }
          }
        }
        krlecount(ginti);
      }

      function krlecount(ginti) {
        if (ginti === 0) {
          taskList.style.display = "none";
          paperBlock.style.display = "block";
          taskList.style.visibility = "hidden";
          paperBlock.style.visibility = "visible";
        } else {
          taskList.style.display = "flex";
          paperBlock.style.display = "none";
          taskList.style.visibility = "visible";
          paperBlock.style.visibility = "hidden";
        }
      }

      let high = 0,
        active = 0,
        completed = 0,
        task_end,
        total = 0;

      function counting() {
        // Total Count Of Task //
        total = arr.length;
        document.getElementById("task_count").innerHTML = total;

        // Sirf High Count Of Task //
        document.getElementById("high_count").innerHTML = high;

        // Complete ka Prayas //
        completed = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i].complete === true) {
            completed++;
          }
        }
        document.getElementById("complete_count").innerHTML = completed;

        // Ab Active Waale //
        active = 0;
        active = arr.length;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i].complete === true) {
            active--;
          }
        }
        document.getElementById("active_count").innerHTML = active;
        document.getElementById("active_task").innerHTML = active;
      }

      // Add task wale button se bas data liya hai //

      function task() {
        let work = tasking.value.trim();
        let option = priority.value;
        let dinValue = calander.value;

        // Apna wala if else taaki user bhaag jaye //

        if (work === "") {
          let a = prompt(
            "Enter 1 For English (Professional) \nEnter 2 For Hinglish (Apni Desi)",
          );
          if (a === "1") {
            alert("PLEASE ENTER ANY TASK WE CAN'T FOUND ANYTHING");
            return;
          } else if (a === "2") {
            alert("SAMJH NHI AA RHI TERE, TASK DAAL KUCH BHI KREGA KYA");
            return;
          } else if (a >= "3" || a <= "0") {
            let b = prompt(
              "Plz, Again Select 1 For English (Professional) \nEnter 2 For Hinglish (Apni Desi)",
            );
            if (b === "1") {
              alert(
                "SORRY WE ONLY HAVE SELCTION OF 1 & 2 PLZ SELECT BETWEEN THEM",
              );
              return;
            } else if (b === "2") {
              alert(
                "Vella he hai na tu jab 2 option diye hai toh kya aise he diye hai kya? Dimaag lagao yrr...",
              );
              return;
            }
          }
        }

        // Yha le rahe hai data kyu? taaki array mein dalva sake //

        const obj = {
          listing: work,
          prior: option,
          samay: dinValue,
          complete: false,
        };

        arr.push(obj);

        // ye jama kr dega yha se //
        jamatask();

        tasking.value = "";
        priority.value = "MEDIUM";
        calander.value = "";

        // YE function ab apan log filter krvayenge all wall aur dikhana wagera //
        nikalo_all();
      }

      // Task nikl waa rhe hai //

      function nikalo_all() {
        if (arr.length > 0) {
          taskList.innerHTML = "";

          taskList.style.display = "flex";
          paperBlock.style.display = "none";

          taskList.style.visibility = "visible";
          paperBlock.style.visibility = "hidden";

          const ul = document.createElement("ul");
          ul.setAttribute("class", "ul_list");
          taskList.append(ul);

          high = 0;
          total = 0;
          completed = 0;
          for (let i = 0; i < arr.length; i++) {
            const div = document.createElement("div");
            div.setAttribute("class", "li_container");

            // Create top row for Checkbox and Task
            const taskRow = document.createElement("div");
            taskRow.setAttribute("class", "task_row");

            const correct = document.createElement("input");
            correct.setAttribute("type", "checkbox");
            correct.setAttribute("class", "correct");
            correct.checked = arr[i].complete;

            const li = document.createElement("li");
            li.setAttribute("class", "li_list");
            li.innerHTML = arr[i].listing;

            // Edit Button
            const editbtn = document.createElement("button");
            editbtn.setAttribute("class", "editbtn");
            editbtn.innerHTML = "✎";
            li.append(editbtn);

            editbtn.addEventListener("click", function () {
              let a = prompt("Change Task", arr[i].listing);
              if (a !== null && a.trim() !== "") {
                arr[i].listing = a.trim();
                jamatask();
                nikalo_all();
              }
            });

            // Delete Button
            const dltbtn = document.createElement("button");
            dltbtn.setAttribute("class", "dltbtn");
            dltbtn.innerHTML = "🗑";
            li.append(dltbtn);

            dltbtn.addEventListener("click", function () {
              let b = prompt("Are you sure to delete? \nYes");
              if (b === "Yes" || b === "yes" || b === "y") {
                arr.splice(i, 1);
                total--;
                jamatask();
                nikalo_all();
              }
            });

            taskRow.append(correct, li);

            // Create bottom row for Priority and Date
            const rowing = document.createElement("div");
            rowing.setAttribute("class", "meta_row");

            const seting = document.createElement("i");
            seting.setAttribute("class", "seting");
            seting.innerHTML = arr[i].prior;

            if (seting.innerHTML === "HIGH") {
              high++;
            }

            if (seting.innerHTML === "MEDIUM") {
              seting.style.color = "#caa835";
            } else if (seting.innerHTML === "HIGH") {
              seting.style.color = "#ef1c10";
            } else if (seting.innerHTML === "LOW") {
              seting.style.color = "#28d74a";
            }

            const dating = document.createElement("i");
            dating.setAttribute("class", "dating");
            if (!arr[i].samay) {
              dating.innerHTML = "📅 No Due Date";
            } else {
              dating.innerHTML = `📅 ${arr[i].samay}`;
            }

            rowing.append(seting, dating);

            if (arr[i].complete) {
              li.style.textDecoration = "line-through";
            }
            correct.addEventListener("change", function () {
              arr[i].complete = correct.checked;
              jamatask();
              if (correct.checked) {
                li.style.textDecoration = "line-through";
              } else {
                li.style.textDecoration = "none";
              }
            });

            // Append krenge dono rows to the main container div
            div.append(taskRow, rowing);
            ul.append(div);

            counting();
          }
        } else {
          taskList.style.display = "none";
          paperBlock.style.display = "block";
          taskList.style.visibility = "hidden";
          paperBlock.style.visibility = "visible";
        }
      }

      nikalo_all();

      function clearing() {
        if (arr.length > -1) {
          taskList.innerHTML = "";

          clearButton.addEventListener("click", function () {
            if (arr.length === 0) {
              alert("Nothing to clear");
              return;
            }
            let c = prompt("Are you sure to delete everything? \nType Yes");
            if (c === "Yes" || c === "yes" || c === "y") {
              for (let i = 0; i < arr.length; i++) {
                arr.splice(i);
                localStorage.removeItem("task");
                nikalo_all();
                document.getElementById("task_count").innerHTML = "0";
                document.getElementById("high_count").innerHTML = "0";
                document.getElementById("complete_count").innerHTML = "0";
                document.getElementById("active_count").innerHTML = "0";
              }
            }
          });
        }
      }

      clearing();

      function target(event) {
        nikalo_all();
        document.getElementById("search");
        showlist();
      }

      function showlist() {
        let count = 0;
        let value = document.getElementById("search").value.toLowerCase();
        let show = document.querySelectorAll(".li_container");
        for (let i = 0; i < arr.length; i++) {
          if (arr[i].listing.toLowerCase().includes(value)) {
            show[i].style.display = "flex";
            count++;
          } else {
            show[i].style.display = "none";
          }
        }
        if (count === 0) {
          alert("Nothing to search");
          document.querySelector(".nothing").style.display = "flex";
          if (value === "") {
            document.querySelector(".nothing").style.display = "none";
          }
        }
      }
    </script>
  </body>
